<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-label="EML operator">
  <rect width="320" height="180" rx="12" fill="#0d0d1a"/>
  <rect x="10" y="10" width="300" height="160" rx="8" fill="#12122a" stroke="#2a2a4a"/>
  <text x="160" y="78" text-anchor="middle" font-family="monospace" font-size="26" fill="#39ff14">eml(x,y)</text>
  <text x="160" y="118" text-anchor="middle" font-family="monospace" font-size="22" fill="#ff3b3b">= exp(x) − log(y)</text>
  <text x="160" y="150" text-anchor="middle" font-family="monospace" font-size="12" fill="#8a8aa8">universal primitive</text>
</svg>
